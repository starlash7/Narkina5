<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Narkina5 graduation to Pump.fun workflow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .title { fill: #0f172a; font-family: "Inter", "Segoe UI", "Noto Sans", sans-serif; font-size: 44px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: "Inter", "Segoe UI", "Noto Sans", sans-serif; font-size: 20px; font-weight: 500; }
      .lane { fill: #64748b; font-family: "Inter", "Segoe UI", "Noto Sans", sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .card-accent { fill: #fff7ed; stroke: #fdba74; stroke-width: 2.2; rx: 14; }
      .card-info { fill: #f0f9ff; stroke: #7dd3fc; stroke-width: 2.2; rx: 14; }
      .num { fill: #334155; font-family: "Inter", "Segoe UI", "Noto Sans", sans-serif; font-size: 18px; font-weight: 700; }
      .head { fill: #111827; font-family: "Inter", "Segoe UI", "Noto Sans", sans-serif; font-size: 24px; font-weight: 700; }
      .desc { fill: #475569; font-family: "Inter", "Segoe UI", "Noto Sans", sans-serif; font-size: 18px; font-weight: 500; }
      .mono { fill: #475569; font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; font-size: 16px; font-weight: 500; }
      .bullet { fill: #1f2937; font-family: "Inter", "Segoe UI", "Noto Sans", sans-serif; font-size: 18px; font-weight: 500; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-dash { fill: none; stroke: #f59e0b; stroke-width: 2.4; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <!-- subtle grid -->
  <g opacity="0.45">
    <path class="grid" d="M 0 120 H 1600"/>
    <path class="grid" d="M 0 360 H 1600"/>
    <path class="grid" d="M 0 620 H 1600"/>
    <path class="grid" d="M 0 900 H 1600"/>
  </g>

  <text class="title" x="58" y="76">NARKINA5: Graduation -> Pump.fun Launch Workflow</text>
  <text class="subtitle" x="58" y="112">Automated path with one explicit wallet signature approval</text>

  <text class="lane" x="60" y="150">Arena Survival Layer</text>
  <text class="lane" x="60" y="392">Launch Execution Layer</text>
  <text class="lane" x="60" y="642">Proof + Settlement Layer</text>

  <!-- row 1 -->
  <rect class="card" x="60" y="170" width="320" height="120"/>
  <text class="num" x="88" y="206">01</text>
  <text class="head" x="140" y="208">Run Season</text>
  <text class="desc" x="88" y="246">64 cells, 7 floors</text>

  <rect class="card" x="430" y="170" width="320" height="120"/>
  <text class="num" x="458" y="206">02</text>
  <text class="head" x="510" y="208">Survivor Cell</text>
  <text class="desc" x="458" y="246">winner finalized</text>

  <rect class="card-accent" x="800" y="170" width="330" height="120"/>
  <text class="num" x="828" y="206">03</text>
  <text class="head" x="880" y="208">Gate Check</text>
  <text class="mono" x="828" y="246">PnL / DD / consistency / risk</text>

  <rect class="card-info" x="1180" y="170" width="320" height="120"/>
  <text class="num" x="1208" y="206">04</text>
  <text class="head" x="1260" y="208">PASS?</text>
  <text class="desc" x="1208" y="246">if yes, continue launch</text>

  <path class="arrow" d="M 380 228 L 428 228"/>
  <path class="arrow" d="M 750 228 L 798 228"/>
  <path class="arrow" d="M 1130 228 L 1178 228"/>

  <!-- row 2 -->
  <rect class="card-info" x="120" y="410" width="360" height="120"/>
  <text class="num" x="148" y="446">05</text>
  <text class="head" x="200" y="448">Build Metadata</text>
  <text class="mono" x="148" y="486">/api/pumpfun?action=ipfs</text>

  <rect class="card-info" x="540" y="410" width="360" height="120"/>
  <text class="num" x="568" y="446">06</text>
  <text class="head" x="620" y="448">Build Create Tx</text>
  <text class="mono" x="568" y="486">/api/pumpfun?action=trade</text>

  <rect class="card-accent" x="1010" y="410" width="430" height="120"/>
  <text class="num" x="1038" y="446">07</text>
  <text class="head" x="1090" y="448">Wallet Signature</text>
  <text class="desc" x="1038" y="486">manual approval (single click)</text>

  <path class="arrow" d="M 480 468 L 538 468"/>
  <path class="arrow" d="M 900 468 L 1008 468"/>
  <path class="arrow" d="M 1340 290 C 1340 346, 1260 378, 1210 408"/>

  <!-- row 3 -->
  <rect class="card" x="220" y="660" width="450" height="150"/>
  <text class="num" x="248" y="698">08</text>
  <text class="head" x="300" y="700">Send On-chain</text>
  <text class="mono" x="248" y="740">Solana mainnet tx broadcast + confirm</text>

  <rect class="card-info" x="760" y="630" width="760" height="230"/>
  <text class="num" x="788" y="668">09</text>
  <text class="head" x="840" y="670">Launch Artifacts (UI Proof)</text>
  <text class="bullet" x="788" y="712">- Mint address</text>
  <text class="bullet" x="788" y="744">- Pump.fun URL</text>
  <text class="bullet" x="788" y="776">- Tx hash + explorer link</text>
  <text class="bullet" x="788" y="808">- Season receipt JSON</text>
  <text class="bullet" x="788" y="840">- Feed health + trust score snapshot</text>

  <path class="arrow" d="M 670 728 L 758 728"/>
  <path class="arrow" d="M 1240 530 C 1240 590, 1160 606, 1095 630"/>

  <!-- fail branch -->
  <rect class="card" x="60" y="884" width="740" height="62"/>
  <text class="mono" x="88" y="922">Gate FAIL: keep champion metadata + season receipt, block token launch</text>
  <path class="arrow-dash" d="M 948 292 C 900 460, 700 640, 560 884"/>
</svg>
