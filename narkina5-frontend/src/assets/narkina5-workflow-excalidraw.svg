<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Narkina5 graduation to Pump.fun workflow">
  <defs>
    <pattern id="paper-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #fcfcfb; }
      .grid { fill: url(#paper-grid); opacity: 0.35; }
      .title { fill: #0f172a; font-family: "Virgil", "Comic Sans MS", cursive; font-size: 52px; font-weight: 700; }
      .subtitle { fill: #374151; font-family: "Virgil", "Comic Sans MS", cursive; font-size: 24px; font-weight: 600; }
      .lane { fill: #6b7280; font-family: "Virgil", "Comic Sans MS", cursive; font-size: 18px; font-weight: 700; letter-spacing: 0.12em; }
      .box { fill: #fffaf0; stroke: #0f172a; stroke-width: 3; rx: 16; ry: 16; }
      .box-blue { fill: #eef6ff; stroke: #0f172a; stroke-width: 3; rx: 16; ry: 16; }
      .box-hot { fill: #fff1e7; stroke: #b45309; stroke-width: 3.2; rx: 16; ry: 16; }
      .step { fill: #111827; font-family: "Virgil", "Comic Sans MS", cursive; font-size: 48px; font-weight: 700; }
      .sub { fill: #374151; font-family: "Virgil", "Comic Sans MS", cursive; font-size: 28px; font-weight: 600; }
      .bullet { fill: #1f2937; font-family: "Virgil", "Comic Sans MS", cursive; font-size: 25px; font-weight: 600; }
      .arrow { stroke: #0f172a; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-dash { stroke: #b45309; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 9; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>
  <rect class="grid" x="0" y="0" width="1600" height="1000"/>

  <text class="title" x="58" y="78">NARKINA5: Graduation -&gt; Pump.fun Launch Workflow</text>
  <text class="subtitle" x="58" y="118">Automated pipeline with one explicit wallet signature approval</text>

  <text class="lane" x="62" y="154">ARENA SURVIVAL LAYER</text>

  <rect class="box" x="60" y="176" width="300" height="120"/>
  <text class="step" x="86" y="224">1) Run Season</text>
  <text class="sub" x="86" y="262">64 cells, 7 floors</text>

  <rect class="box" x="420" y="176" width="300" height="120"/>
  <text class="step" x="446" y="224">2) Survivor Cell</text>
  <text class="sub" x="446" y="262">winner finalized</text>

  <rect class="box-hot" x="780" y="176" width="320" height="120"/>
  <text class="step" x="806" y="224">3) Gate Check</text>
  <text class="sub" x="806" y="262">PnL / DD / consistency / risk</text>

  <rect class="box-blue" x="1160" y="176" width="280" height="120"/>
  <text class="step" x="1188" y="224">4) PASS?</text>
  <text class="sub" x="1188" y="262">if yes, continue launch</text>

  <path class="arrow" d="M 360 236 L 418 236"/>
  <path class="arrow" d="M 720 236 L 778 236"/>
  <path class="arrow" d="M 1100 236 L 1158 236"/>

  <text class="lane" x="62" y="396">LAUNCH EXECUTION LAYER</text>

  <rect class="box-blue" x="120" y="420" width="340" height="120"/>
  <text class="step" x="148" y="468">5) Build Metadata</text>
  <text class="sub" x="148" y="506">/api/pumpfun?action=ipfs</text>

  <rect class="box-blue" x="520" y="420" width="340" height="120"/>
  <text class="step" x="548" y="468">6) Build Create Tx</text>
  <text class="sub" x="548" y="506">/api/pumpfun?action=trade</text>

  <rect class="box-hot" x="960" y="420" width="420" height="120"/>
  <text class="step" x="988" y="468">7) Wallet Signature</text>
  <text class="sub" x="988" y="506">manual approval (single click)</text>

  <path class="arrow" d="M 460 480 L 518 480"/>
  <path class="arrow" d="M 860 480 L 958 480"/>
  <path class="arrow" d="M 1300 296 C 1300 352, 1218 380, 1140 418"/>

  <text class="lane" x="62" y="676">PROOF + SETTLEMENT LAYER</text>

  <rect class="box" x="220" y="700" width="420" height="140"/>
  <text class="step" x="248" y="748">8) Send On-chain</text>
  <text class="sub" x="248" y="786">Solana mainnet tx broadcast + confirm</text>

  <rect class="box-blue" x="760" y="670" width="760" height="220"/>
  <text class="step" x="790" y="718">9) Launch Artifacts (UI Proof)</text>
  <text class="bullet" x="790" y="756">- Mint address</text>
  <text class="bullet" x="790" y="786">- Pump.fun URL</text>
  <text class="bullet" x="790" y="816">- Tx hash + explorer link</text>
  <text class="bullet" x="790" y="846">- Season receipt JSON</text>
  <text class="bullet" x="790" y="876">- Feed health + trust score snapshot</text>

  <path class="arrow" d="M 640 770 L 758 770"/>
  <path class="arrow" d="M 1120 542 C 1120 608, 1068 632, 1040 668"/>

  <rect class="box" x="60" y="876" width="740" height="80"/>
  <text class="sub" x="86" y="926">Gate FAIL branch: keep champion metadata + season receipt, block token launch</text>
  <path class="arrow-dash" d="M 940 296 C 860 470, 720 640, 620 876"/>
</svg>
